# ============================================================================
# data/combat 模板（#92 时序引擎）
#
# 用法：复制为 data/combat/{门派}.toml（如 mowen.toml）后按需删除/填写。
# 以 `_` 开头的文件不会被加载。
#
# 说明：
#   - 这里只写「时序 overlay」；伤害数值仍在 data/shuxing/{门派}.toml（不要手改那边）。
#   - 没写的技能 = 默认瞬发、1.5s GCD、无 CD。
#   - 所有表都是 deny_unknown_fields：字段名写错会解析失败（错误会指出文件与字段）。
#   - 校验失败时引擎退回默认（1.5s GCD），不会崩溃；可用 load_combat_bundle 检查。
#
# 示例门派：莫问（技能取自 data/shuxing/mowen.toml 的真实 id）
# ============================================================================

[meta]
profession = "mowen"
version = "template-1"
note = "填表模板；复制为 mowen.toml 后按需修改"

# ----------------------------------------------------------------------------
# 形态：不写 = 单一默认形态（1.5s GCD）
# 双形态门派（刀宗单持/双持、蓬莱上天）在此声明；不同形态各自独立 GCD 通道。
# ----------------------------------------------------------------------------
[[form]]
id = "default"
name = "常规"
gcd_base = 1.5
initial = true
skills = [[14064, 14474], [14065, 14311]]

# 双形态示例（取消注释使用）：
# [[form]]
# id = "dual"
# name = "双持"
# gcd_base = 1.0
# skills = [[14064, 14474]]

# ----------------------------------------------------------------------------
# 技能时序 override（每个技能一条；只写与默认不同的字段）
# ----------------------------------------------------------------------------
[[skill_combat]]
skill_id = 14064
sub_id = 14474
form = "default"
cast_time = 1.5

# 带 CD 的示例
# [[skill_combat]]
# skill_id = 10447
# sub_id = 14063
# cooldown = 20.0
# cd_haste = false

# 充能技能示例（2 层，每层 8 秒恢复）
# [[skill_combat]]
# skill_id = 14065
# sub_id = 14311
# charges = 2
# recharge = 8.0
# cd_haste = true

# 施放副作用示例：切形态 + 额外占用 GCD 通道 + 锁另一个技能
# [[skill_combat]]
# skill_id = 14064
# sub_id = 14474
# form = "single"
# on_cast = { switch_form = "dual", gcd_lanes = ["dual"], lock_skills = [[14082, 0]] }

# ----------------------------------------------------------------------------
# 定时 buff（技能通过 buff_id 引用；ignore_cap = 可突破 25% 上限）
# ----------------------------------------------------------------------------
# [[buff]]
# id = "mowen_jiasu"
# name = "示例加速 buff"
# duration = 10.0
# max_stacks = 1
# refresh = true
# ignore_cap = false
# effects = [{ jiasu_pct = 2.0 }, { base_atk_pct = 5.0 }]

# ----------------------------------------------------------------------------
# 秘籍（挂在技能上的修正项，不新增技能条目）
# ----------------------------------------------------------------------------
# [[miji]]
# id = "mowen_gong_miji_1"
# name = "宫·人偶图绝章"
# skill_id = 14064
# sub_id = 14474
# modifiers = [{ base_damage_mul = 10.0 }, { cast_time_mul = -5.0 }]

# ----------------------------------------------------------------------------
# 奇穴（激活后替换默认技能为独立条目，或只加修正）
# ----------------------------------------------------------------------------
# [[qixue]]
# id = "mowen_qixue_1"
# name = "示例奇穴"
# slot = 1
# replaces_skill_id = 14064
# replaces_sub_id = 14474
# modifiers = [{ hit_up_add = 5 }]
#
# 需要替换成独立技能条目时（字段同 data/shuxing 的 [[skill]]，只写需要的项）：
# replacement = { skill_name = "宫·奇穴", skill_id = 14064, sub_id = 14474, base_damage1 = 200, base_damage2 = 240, atk_xishu = 2.8 }
