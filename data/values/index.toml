# ============================================================================
# data/values/index.toml —— 数值集清单
#
# 运行期由客户端读取：选定值集 → 加载对应快照文件（本目录内）。
# 随 data 通道（data_manifest）下发；客户端本地缺失时回退内置兜底（体验服一测）。
#
# 字段：
#   default        — 默认值集 id（客户端未显式选择时使用）
#   [[value_sets]] — id / name（界面显示）/ level（等级，仅标识）/ file（本目录内文件名）
# ============================================================================

default = "cszj-exp-260908"

[[value_sets]]
id = "cszj-exp-260908"
name = "体验服·苍生铸世一测"
level = 50
file = "cszj-exp-260908.toml"

[[value_sets]]
id = "live-130"
name = "正式服·130级"
level = 130
file = "live-130.toml"
