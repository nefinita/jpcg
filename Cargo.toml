[workspace]
resolver = "2"
members = [
    "crates/*",
    "examples/jpcg_app/src-tauri",
    "server_tools/manifest-gen",
    "server_tools/forum"
]

[workspace.package]
license = "GPL-3.0"
readme = "README.md"
version = "2.0.0-alpha.0"
edition = "2024"

[workspace.dependencies]
tokio = { version = "1.52.1", features = ["full"] }
csv = "1.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.2+spec-1.1.0"
colorized = "1.0.0"
libc = "0.2.186"
axum = "0.8.9"
tower-http = { version = "0.6.8", features = ["fs", "cors"] }
reqwest = { version = "0.13.3", features = ["json"] }
indicatif = "0.18.4"
clap = { version = "4.6.1", features = ["derive"] }
regex = "1.12.3"
tempfile = "3.27.0"
sha2 = "0.11.0"
hex = "0.4.3"
tar = "0.4.45"
flate2 = "1.1.9"
jpcg_core = { path = "crates/jpcg_core" }
jpcg_update = { path = "crates/jpcg_update" }

[workspace.lints.clippy]

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_html_tags = "deny"
