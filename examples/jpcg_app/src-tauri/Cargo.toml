[package]
name = "jpcg_app"
version.workspace = true
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jpcg_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { workspace = true }
jpcg_api = { workspace = true }
jpcg_const = { workspace = true }
# 双模式：
#   static  （默认）— 编译期链接 core，Rust 直调 host 模块
#   dynamic        — dlopen libjpcg_core.{dylib,so,dll}，经 jpcg_call JSON 调用
# jpcg_update 两模式均依赖（命令签名与进度事件 DTO 需要；计算逻辑在 core）
jpcg_core = { workspace = true, optional = true }
jpcg_update = { workspace = true }
libloading = { version = "0.8", optional = true }

[features]
default = ["static"]
static = ["dep:jpcg_core"]
dynamic = ["dep:libloading"]
