<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JPCG - JX3 PVP 计算器</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div class="app-container">

    <div class="app-body">

      <!-- ===== 活动栏（VSCode 风格） ===== -->
      <div class="activity-bar">
        <button id="btn-forum-sidebar" class="activity-bar-btn" title="数据论坛">🌐</button>
        <button id="btn-combo-sidebar" class="activity-bar-btn" title="技能连招">🔗</button>
      </div>

      <!-- ===== 侧栏（论坛 / 连招 分页） ===== -->
      <aside id="sidebar" class="forum-sidebar collapsed">

        <!-- 论坛页 -->
        <div id="forum-panel" class="sidebar-panel">
          <div class="sidebar-header">
            <h2>🌐 数据论坛</h2>
            <button id="forum-close" class="icon-btn" title="关闭">✕</button>
          </div>
          <div class="sidebar-body">
            <div class="forum-toolbar">
              <input type="text" id="forum-search" class="form-input forum-search" placeholder="搜索文件名..." />
              <button id="forum-refresh" class="btn btn-secondary btn-sm">🔄 刷新</button>
            </div>
            <table class="forum-table">
              <thead>
                <tr>
                  <th>文件名</th>
                  <th class="col-size">大小</th>
                  <th class="col-time">上传时间</th>
                  <th class="col-action">操作</th>
                </tr>
              </thead>
              <tbody id="forum-file-list">
                <tr><td colspan="4" class="empty">加载中...</td></tr>
              </tbody>
            </table>
          </div>
          <div class="sidebar-footer">
            <div class="pagination" id="forum-pagination">
              <button id="page-prev" class="btn btn-secondary btn-sm" disabled>◀ 上一页</button>
              <span id="page-info" class="page-info">第 1 / 1 页</span>
              <button id="page-next" class="btn btn-secondary btn-sm" disabled>下一页 ▶</button>
            </div>
          </div>
        </div>

        <!-- 连招页 -->
        <div id="combo-panel" class="sidebar-panel" hidden>
          <div class="sidebar-header">
            <h2>🔗 技能连招</h2>
            <button id="combo-close" class="icon-btn" title="关闭">✕</button>
          </div>
          <div class="sidebar-body">
            <div class="combo-sequence-wrap">
              <div class="combo-label">连招序列</div>
              <div id="combo-sequence" class="combo-sequence">
                <span class="combo-empty">暂无技能，请从下方添加</span>
              </div>
            </div>
            <div class="combo-pool">
              <div class="combo-label">可用技能</div>
              <div id="combo-pool-list" class="combo-pool-list">
                <span class="combo-empty">请先进行计算以获取技能列表</span>
              </div>
            </div>
          </div>
          <div class="sidebar-footer">
            <button id="combo-clear" class="btn btn-secondary btn-sm">🗑️ 清空连招</button>
          </div>
        </div>

      </aside>

      <!-- ===== 主区域 ===== -->
      <div class="main-area">

        <!-- ===== 顶栏 ===== -->
        <header class="app-header">
          <div class="logo">
            <span class="logo-icon">⚔️</span>
            <h1>JPCG - JX3 PVP 计算器</h1>
          </div>
          <div class="header-actions">
            <button id="theme-toggle" class="icon-btn" title="切换主题">🌓</button>
          </div>
        </header>

        <!-- ===== 主内容区 ===== -->
        <main class="main-content">

          <!-- ===== 左侧：配置面板 ===== -->
          <section class="panel config-panel">
            <div class="panel-header">
              <h2>⚙️ 配置面板</h2>
              <span id="config-status" class="panel-badge" data-status="ready">就绪</span>
            </div>

            <div class="form-group">
              <label class="form-label" for="xinfa-select">
                <span class="label-icon">🧘</span> 心法选择
              </label>
              <select id="xinfa-select" class="form-select xinfa-select">
                <option value="" disabled selected>请选择心法...</option>
              </select>
            </div>

            <fieldset class="attr-group">
              <legend class="attr-legend">🎯 玩家属性</legend>
              <div class="attr-grid">
                <div class="input-field">
                  <label for="jichu_shuxing">基础属性</label>
                  <input type="number" id="jichu_shuxing" class="form-input" placeholder="0" min="0" step="1" />
                </div>
                <div class="input-field">
                  <label for="jichu_gongji">基础攻击</label>
                  <input type="number" id="jichu_gongji" class="form-input" placeholder="0" min="0" step="1" />
                </div>
                <div class="input-field">
                  <label for="huixin_dengji">会心等级</label>
                  <input type="number" id="huixin_dengji" class="form-input" placeholder="0" min="0" step="1" />
                </div>
                <div class="input-field">
                  <label for="huixin_xiaoguo">会心效果</label>
                  <input type="number" id="huixin_xiaoguo" class="form-input" placeholder="0" min="0" step="1" />
                </div>
                <div class="input-field">
                  <label for="pofang_dengji">破防等级</label>
                  <input type="number" id="pofang_dengji" class="form-input" placeholder="0" min="0" step="1" />
                </div>
                <div class="input-field">
                  <label for="wuqi_shanghai">武器伤害</label>
                  <input type="number" id="wuqi_shanghai" class="form-input" placeholder="0" min="0" step="1" />
                </div>
              </div>
            </fieldset>

            <fieldset class="attr-group">
              <legend class="attr-legend">🎯 目标属性</legend>
              <div class="attr-grid">
                <div class="input-field">
                  <label for="waigong_fangyu">外功防御</label>
                  <input type="number" id="waigong_fangyu" class="form-input" placeholder="0" min="0" step="1" />
                </div>
                <div class="input-field">
                  <label for="neigong_fangyu">内功防御</label>
                  <input type="number" id="neigong_fangyu" class="form-input" placeholder="0" min="0" step="1" />
                </div>
                <div class="input-field">
                  <label for="yujin_dengji">御劲等级</label>
                  <input type="number" id="yujin_dengji" class="form-input" placeholder="0" min="0" step="1" />
                </div>
                <div class="input-field">
                  <label for="huajin_dengji">化劲等级</label>
                  <input type="number" id="huajin_dengji" class="form-input" placeholder="0" min="0" step="1" />
                </div>
                <div class="input-field">
                  <label for="jianshang_bili">减伤比例(%)</label>
                  <input type="number" id="jianshang_bili" class="form-input" placeholder="0" min="0" max="100" step="0.1" />
                </div>
              </div>
            </fieldset>

            <div class="action-bar">
              <button id="btn-calculate" class="btn btn-primary btn-lg">
                <span class="btn-icon">🧮</span> 开始计算
              </button>
              <button id="btn-save" class="btn btn-secondary">
                <span class="btn-icon">💾</span> 保存
              </button>
              <button id="btn-load" class="btn btn-secondary">
                <span class="btn-icon">📥</span> 加载
              </button>
              <button id="btn-clear" class="btn btn-danger">
                <span class="btn-icon">🗑️</span> 清空
              </button>
              <button id="btn-update" class="btn btn-danger">
                <span class="btn-icon">🔄</span> 更新
              </button>
              <div id="update-progress" class="update-progress" hidden>
                <div class="update-progress-bar">
                  <div id="update-progress-fill" class="update-progress-fill"></div>
                </div>
                <span id="update-progress-text" class="update-progress-text">准备中...</span>
              </div>
            </div>
          </section>

          <!-- ===== 右侧：结果面板 ===== -->
          <section class="panel result-panel">
            <div class="panel-header">
              <h2>📊 计算结果</h2>
              <div class="result-meta">
                <span id="result-count">0 个技能</span>
                <button id="btn-export" class="icon-btn" title="导出结果">📤</button>
              </div>
            </div>

            <div class="result-scroll">
              <table class="result-table">
                <thead>
                  <tr>
                    <th>技能名称</th>
                    <th class="col-num">Y</th>
                    <th class="col-num">B</th>
                    <th class="col-num">I</th>
                    <th class="col-num">N</th>
                    <th class="col-num" style="color: var(--accent-success)">H</th>
                    <th class="col-num" style="color: var(--accent-success)">Q</th>
                  </tr>
                </thead>
                <tbody id="result-body">
                  <tr class="empty-row">
                    <td colspan="7">
                      <div class="empty-state">
                        <span class="empty-icon">🎲</span>
                        <p>填写属性后点击「开始计算」查看结果</p>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

        <div id="result-stats" class="result-stats" hidden>
          <div class="stat-item">
            <span id="stat-label-1" class="stat-label">最大期望</span>
            <span id="stat-max-q" class="stat-value">0</span>
          </div>
          <div class="stat-item">
            <span id="stat-label-2" class="stat-label">平均期望</span>
            <span id="stat-avg-q" class="stat-value">0</span>
          </div>
          <div class="stat-item">
            <span id="stat-label-3" class="stat-label">会心占比</span>
            <span id="stat-crit-ratio" class="stat-value">0%</span>
          </div>
        </div>
          </section>
        </main>

        <!-- ===== 底栏 ===== -->
        <footer class="app-footer">
          <div class="status-bar">
            <span id="status-message">就绪 — 请填写属性配置后开始计算</span>
            <span id="status-dot" class="status-dot" data-status="ready"></span>
          </div>
        </footer>

      </div><!-- /main-area -->
    </div><!-- /app-body -->

  </div>

  <!-- Toast 通知容器 -->
  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
