<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>⚔️ 剑网3伤害计算器</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div id="app" class="app-container">
    
    <!-- 顶部标题栏 -->
    <header class="app-header">
      <div class="logo">
        <span class="logo-icon">⚔️</span>
        <h1>剑网3伤害计算器</h1>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" class="icon-btn" title="切换主题">🌓</button>
      </div>
    </header>

    <!-- 主内容区 -->
    <main class="main-content">
      
      <!-- 左侧：配置面板 -->
      <section class="panel config-panel">
        <div class="panel-header">
          <h2>📋 属性配置</h2>
          <span class="panel-badge" id="config-status">未加载</span>
        </div>

        <!-- 心法选择 -->
        <div class="form-group">
          <label for="xinfa-select" class="form-label">
            <span class="label-icon">🧘</span> 选择心法
          </label>
          <select id="xinfa-select" class="form-select xinfa-select">
            <option value="" disabled selected>请选择心法...</option>
            <!-- 由 JS 动态填充 -->
          </select>
        </div>

        <!-- 玩家属性 -->
        <fieldset class="attr-group">
          <legend class="attr-legend">👤 玩家属性</legend>
          <div class="attr-grid">
            <div class="input-field">
              <label for="jichu_shuxing">基础属性</label>
              <input type="number" id="jichu_shuxing" class="form-input" placeholder="0" min="0" />
            </div>
            <div class="input-field">
              <label for="jichu_gongji">基础攻击</label>
              <input type="number" id="jichu_gongji" class="form-input" placeholder="0" min="0" />
            </div>
            <div class="input-field">
              <label for="huixin_dengji">会心等级</label>
              <input type="number" id="huixin_dengji" class="form-input" placeholder="0" min="0" />
            </div>
            <div class="input-field">
              <label for="huixin_xiaoguo">会心效果</label>
              <input type="number" id="huixin_xiaoguo" class="form-input" placeholder="0" min="0" />
            </div>
            <div class="input-field">
              <label for="pofang_dengji">破防等级</label>
              <input type="number" id="pofang_dengji" class="form-input" placeholder="0" min="0" />
            </div>
            <div class="input-field">
              <label for="wuqi_shanghai">武器伤害</label>
              <input type="number" id="wuqi_shanghai" class="form-input" placeholder="0" min="0" />
            </div>
          </div>
        </fieldset>

        <!-- 目标属性 -->
        <fieldset class="attr-group">
          <legend class="attr-legend">🎯 目标属性</legend>
          <div class="attr-grid">
            <div class="input-field">
              <label for="waigong_fangyu">外功防御</label>
              <input type="number" id="waigong_fangyu" class="form-input" placeholder="0" min="0" />
            </div>
            <div class="input-field">
              <label for="neigong_fangyu">内功防御</label>
              <input type="number" id="neigong_fangyu" class="form-input" placeholder="0" min="0" />
            </div>
            <div class="input-field">
              <label for="yujin_dengji">御劲等级</label>
              <input type="number" id="yujin_dengji" class="form-input" placeholder="0" min="0" />
            </div>
            <div class="input-field">
              <label for="huajin_dengji">化劲等级</label>
              <input type="number" id="huajin_dengji" class="form-input" placeholder="0" min="0" />
            </div>
            <div class="input-field">
              <label for="jianshang_bili">减伤比例(%)</label>
              <input type="number" id="jianshang_bili" class="form-input" placeholder="0" min="0" max="100" step="0.1" />
            </div>
          </div>
        </fieldset>

        <!-- 操作按钮 -->
        <div class="action-bar">
          <button id="btn-calculate" class="btn btn-primary btn-lg">
            <span class="btn-icon">🧮</span> 开始计算
          </button>
          <button id="btn-save" class="btn btn-secondary">
            <span class="btn-icon">💾</span> 保存
          </button>
          <button id="btn-load" class="btn btn-secondary">
            <span class="btn-icon">📥</span> 加载
          </button>
          <button id="btn-clear" class="btn btn-danger">
            <span class="btn-icon">🗑️</span> 清空
          </button>
          <button id="btn-update" class="btn btn-danger">
            <span class="btn-icon">🔄</span> 更新
          </button>
        </div>
      </section>

      <!-- 右侧：结果面板 -->
      <section class="panel result-panel">
        <div class="panel-header">
          <h2>📊 计算结果</h2>
          <div class="result-meta">
            <span id="result-count">0 个技能</span>
            <button id="btn-export" class="icon-btn" title="导出结果">📤</button>
          </div>
        </div>

        <!-- 结果表格 -->
        <div class="result-scroll">
          <table class="result-table">
            <thead>
              <tr>
                <th class="col-name">技能名称</th>
                <th class="col-num">穿透系数(Y)</th>
                <th class="col-num">基础伤害(B)</th>
                <th class="col-num">技能伤害(I)</th>
                <th class="col-num">普通伤害(N)</th>
                <th class="col-num highlight">会心伤害(H)</th>
                <th class="col-num highlight">期望伤害(Q)</th>
              </tr>
            </thead>
            <tbody id="result-body">
              <tr class="empty-row">
                <td colspan="7">
                  <div class="empty-state">
                    <span class="empty-icon">🎲</span>
                    <p>填写属性后点击「开始计算」查看结果</p>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- 结果统计 -->
        <div class="result-stats" id="result-stats" hidden>
          <div class="stat-item">
            <span class="stat-label">连招期望</span>
            <span class="stat-value" id="stat-max-q">-</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">击杀概率</span>
            <span class="stat-value" id="stat-avg-q">-</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">连招长度</span>
            <span class="stat-value" id="stat-crit-ratio">-</span>
          </div>
        </div>
      </section>

    </main>

    <!-- 底部状态栏 -->
    <footer class="app-footer">
      <div class="status-bar">
        <span id="status-message">就绪</span>
        <span class="status-dot" id="status-dot"></span>
      </div>
    </footer>

    <!-- Toast 通知容器 -->
    <div id="toast-container" class="toast-container"></div>

  </div>

  <!-- 脚本加载 -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
