[package]
name = "jpcg_gear"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "gear-opt"
path = "src/bin/gear-opt.rs"
required-features = ["engine"]

[features]
default = ["engine"]
engine = ["dep:jpcg_core", "dep:jpcg_combo", "dep:clap"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap = { workspace = true, optional = true }
jpcg_api.workspace = true
jpcg_core = { workspace = true, optional = true }
jpcg_combo = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
libloading = "0.9"
