# ============================================================================
# level_constant.toml —— 等级常数快照（编译期唯一真源）
# 内容：剑网3 属性换算分母（×1024 制）逐项逆向观测值。
# 说明：
#   - 这些分母随等级/赛季变化，正逆向"等级 → 常数"关系；
#     当前快照对应 130 级·第 3 赛季（来源 jpcg_core 引擎公式 + 御劲补全）。
#   - 逆向完成前，各值直接列出；完成后此文件可退化为推导系数。
#   - level 仅作快照记录/预计算使用，不进入 LevelConstant 结构。
#   - 新增/改名任何 key 必须同步 crates/jpcg_const/src/level_constant.rs
#     的白名单解析，否则编译失败（防漂移）。
# ============================================================================

level = 130

# --- 攻击侧换算分母（玩家属性 → 1024 制系数）---
pofang_xishu  = 225957.6   # 破防等级 → 破防减伤
huixin_xishu  = 197703.0   # 会心等级 → 会心率
huixiao_xishu = 72844.2    # 会效等级 → 会心伤害

# --- 御劲侧（御劲等级同时减免目标的会心率与会心伤害）---
yujin_xishu   = 197703.0   # 御劲 → 目标会心率减免（当前与 huixin_xishu 同值，是否独立常量待逆向确认）
yuhui_xishu   = 55123.2    # 御劲 → 目标会心伤害减免（原引擎硬编码值，CoefficientConfig 曾缺失）

# --- 目标侧换算分母 ---
huajin_xishu  = 30115.8    # 化劲等级 → 伤害减免
fangyu_xishu  = 126007.2   # 防御等级 → 伤害减免

# --- 规则常数（乘法减伤，非 1024 制分母）---
pvp_global_jianshang = 0.9   # PVP 全局减伤比例
